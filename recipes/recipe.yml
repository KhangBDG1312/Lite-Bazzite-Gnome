---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: Lite-Bazzite-Gnome
description: Ban Bazzite GNOME sieu nhe cho ThinkPad

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: default-flatpaks
    configurations:
      notify: true
      scope: system
    install:
      - org.mozilla.firefox
